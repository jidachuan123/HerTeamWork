server:
  port: 8003

spring:
  application:
    name: her-subsystem

# 注册到门户侧 Eureka，供门户做服务发现
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# ===== SSO 对接配置 =====
sso:
  # 门户共享密钥（方式A）—— 必须与 consumer-service 的 jwt.secret 完全一致
  # 真实对接时由门户方安全渠道（线下/密管系统）分发给各子系统
  portal-secret: "cdf102f540eeb3255890252f383417f1fba3e1e7db6a403424921723f5dd684fc2b130e1035c26b20a841408efb3eee7"
  # 本系统在门户登记的应用编码（与 consumer-service 的 portal.subsystems[].code=A 对应）
  app-code: "A"
  # 本系统自己的会话密钥（与门户无关）
  session-secret: "6d131470986ffb7c202988f350a13c68ff70c24920467f14a96a462e6f4d2e0f"
  # 本系统会话有效期（毫秒）默认 2 小时
  session-expire: 7200000
  # 门户地址（子系统退出后跳回门户，门户会话若仍在则直接落到卡片页）
  portal-url: "http://localhost:3002/"
