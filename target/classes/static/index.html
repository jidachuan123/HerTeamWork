<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Her 子系统 - 业务系统A</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: #fff; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.3);
    width: 420px; padding: 40px 36px; animation: fadeIn .4s ease;
  }
  @keyframes fadeIn { from { opacity:0; transform: translateY(16px);} to {opacity:1; transform:none;} }
  .logo { text-align: center; margin-bottom: 8px; }
  .logo .badge {
    display: inline-block; padding: 4px 14px; border-radius: 20px;
    background: #eef2ff; color: #667eea; font-size: 12px; font-weight: 600;
  }
  h1 { text-align: center; font-size: 22px; color: #1f2d3d; margin: 12px 0 4px; }
  .sub { text-align: center; color: #909399; font-size: 13px; margin-bottom: 26px; }

  .form-item { margin-bottom: 16px; }
  .form-item label { display:block; font-size: 13px; color:#606266; margin-bottom:6px; }
  .form-item input {
    width: 100%; padding: 10px 12px; border: 1px solid #dcdfe6; border-radius: 8px;
    font-size: 14px; outline: none; transition: border .2s;
  }
  .form-item input:focus { border-color: #667eea; }
  .btn {
    width: 100%; padding: 11px; border: none; border-radius: 8px; cursor: pointer;
    background: linear-gradient(135deg, #667eea, #764ba2); color: #fff;
    font-size: 15px; font-weight: 600; transition: opacity .2s;
  }
  .btn:hover { opacity: .9; }
  .btn:disabled { opacity: .6; cursor: not-allowed; }

  .msg { padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; }
  .msg.error { background: #fef0f0; color: #f56c6c; display: block; }
  .msg.info { background: #f0f9eb; color: #67c23a; display: block; }

  /* 已登录视图 */
  .welcome { text-align: center; }
  .avatar {
    width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 14px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; font-size: 28px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .welcome h2 { font-size: 20px; color: #1f2d3d; margin-bottom: 6px; }
  .auth-type {
    display: inline-block; padding: 3px 12px; border-radius: 14px; font-size: 12px; font-weight: 600;
    background: #f0f9eb; color: #67c23a; margin-bottom: 18px;
  }
  .info-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
  .info-table td {
    padding: 9px 12px; font-size: 13px; border-bottom: 1px solid #f0f0f0;
  }
  .info-table td:first-child { color: #909399; width: 90px; text-align: right; }
  .info-table td:last-child { color: #303133; text-align: left; }
  .link-btn {
    background: none; border: 1px solid #dcdfe6; border-radius: 8px; padding: 9px 18px;
    color: #606266; font-size: 13px; cursor: pointer;
  }
  .link-btn:hover { border-color: #667eea; color: #667eea; }
  .tip { text-align:center; font-size: 12px; color: #c0c4cc; margin-top: 14px; }
</style>
</head>
<body>
<div class="card">

  <!-- ===== 登录视图 ===== -->
  <div id="loginView">
    <div class="logo"><span class="badge">第三方子系统 · Her System</span></div>
    <h1>业务系统 A</h1>
    <p class="sub">本系统账号独立，或从门户 SSO 免登录进入</p>
    <div id="msg" class="msg"></div>
    <div class="form-item">
      <label>用户名</label>
      <input id="username" placeholder="heradmin" value="heradmin">
    </div>
    <div class="form-item">
      <label>密码</label>
      <input id="password" type="password" placeholder="123456">
    </div>
    <button class="btn" id="loginBtn" onclick="doLogin()">登 录</button>
    <p class="tip">模拟账号：heradmin / 123456</p>
  </div>

  <!-- ===== 已登录视图 ===== -->
  <div id="welcomeView" style="display:none">
    <div class="welcome">
      <div class="avatar" id="avatarText">U</div>
      <h2 id="welcomeName">欢迎</h2>
      <span class="auth-type" id="authType">SSO 单点登录</span>
      <table class="info-table">
        <tr><td>用户ID</td><td id="infoUserId">-</td></tr>
        <tr><td>用户名</td><td id="infoUsername">-</td></tr>
        <tr><td>姓名</td><td id="infoRealName">-</td></tr>
        <tr><td>登录方式</td><td id="infoAuthType">-</td></tr>
        <tr><td>登录时间</td><td id="infoLoginTime">-</td></tr>
      </table>
      <button class="link-btn" onclick="doLogout()">退出登录</button>
    </div>
  </div>
</div>

<script>
const API = location.origin + '/api';
let loginMeta = {};

function showMsg(text, ok) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + (ok ? 'info' : 'error');
}

function showWelcome(data) {
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('welcomeView').style.display = 'block';
  document.getElementById('avatarText').textContent = (data.realName || data.username || 'U').slice(0, 1).toUpperCase();
  document.getElementById('welcomeName').textContent = '欢迎，' + (data.realName || data.username);
  document.getElementById('authType').textContent = data.authType === 'SSO' ? 'SSO 单点登录 ✦' : '本地账号登录';
  document.getElementById('infoUserId').textContent = data.userId;
  document.getElementById('infoUsername').textContent = data.username;
  document.getElementById('infoRealName').textContent = data.realName;
  document.getElementById('infoAuthType').textContent = data.authType === 'SSO' ? '门户 SSO 免登录' : '子系统本地账号';
  document.getElementById('infoLoginTime').textContent = data.loginTime || loginMeta.loginTime || '-';
}

function setToken(token, meta) {
  localStorage.setItem('her_token', token);
  if (meta) loginMeta = meta;
}

async function doLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = '登录中...';
  try {
    const res = await fetch(API + '/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const json = await res.json();
    if (json.code === 200) {
      setToken(json.result.token, json.result);
      showWelcome(json.result);
    } else {
      showMsg(json.message || '登录失败', false);
    }
  } catch (e) {
    showMsg('网络异常：' + e.message, false);
  } finally {
    btn.disabled = false; btn.textContent = '登 录';
  }
}

async function checkToken() {
  const token = localStorage.getItem('her_token');
  if (!token) return false;
  try {
    const res = await fetch(API + '/me', { headers: { 'Authorization': 'Bearer ' + token } });
    const json = await res.json();
    if (json.code === 200) { showWelcome(json.result); return true; }
    localStorage.removeItem('her_token');
    return false;
  } catch (e) { return false; }
}

/** 用门户跳转带来的 ticket 换取本系统会话 */
async function ssoLogin(ticket) {
  try {
    const res = await fetch(API + '/sso/login?ticket=' + encodeURIComponent(ticket), { method: 'POST' });
    const json = await res.json();
    if (json.code === 200) {
      setToken(json.result.token, json.result);
      showWelcome(json.result);
      // 从地址栏移除 ticket，避免泄露/刷新重复消费
      history.replaceState(null, '', location.pathname);
      return true;
    } else {
      showMsg('SSO 登录失败：' + json.message, false);
      return false;
    }
  } catch (e) {
    showMsg('SSO 网络异常：' + e.message, false);
    return false;
  }
}

function doLogout() {
  localStorage.removeItem('her_token');
  // 退出本系统后跳回门户（门户会话仍在 → 直接落到卡片页）
  fetch(API + '/sso/logout', { method: 'POST' })
    .then(r => r.json())
    .then(j => {
      const url = (j.result && j.result.portalUrl) ? j.result.portalUrl : location.origin;
      location.href = url;
    })
    .catch(() => { location.href = location.pathname; });
}

(async function init() {
  const params = new URLSearchParams(location.search);
  const ticket = params.get('ticket');
  if (ticket) {
    // 门户 SSO 跳转进入：优先用 ticket 免登录
    if (await ssoLogin(ticket)) return;
  }
  // 已有本系统会话则直接进入
  if (await checkToken()) return;
  // 否则显示登录表单
})();
</script>
</body>
</html>
